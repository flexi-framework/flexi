!=============================================================================== !
! OUTPUT
!=============================================================================== !
ProjectName    = CHANNEL_004
DebugMesh      = T                              ! Output debug mesh in XDMF format
DebugVisu      = F                              ! Launch the GMSH GUI to visualize the mesh

!=============================================================================== !
! MESH
!=============================================================================== !
Mode         = 1                                ! Cartesian Box
nZones       = 1                                ! Number of zones
MeshSorting  = IJK                              ! Structured sorting
nElems       = (/4,4,4/)                        ! Number of elements per direction
BCIndex      = (/1,2,3,4,5,6/)                  ! Indices of UserDefinedBoundaries

X0           = (/0.,-1.,-0.5PI/)                ! Corner node
DX           = (/2PI,2.,PI/)                    ! Mesh extent
StretchType  = (/0,3,0/)                        ! (x,y,z) - direction and type - 3: Bell shape
DxMaxToDxMin = (/1.,50.,1./)                    ! Ratio of largest to smallest cell

!================================================================================================================================= !
! BOUNDARY CONDITIONS
!================================================================================================================================= !
BoundaryName = BC_periodicz-                    ! BC index 1
BoundaryType = (/1,0,0,2/)                      ! (/ Type, curveIndex, State, alpha /)
BoundaryName = BC_wall_lower                    ! BC index 2
BoundaryType = (/4,0,1,0/)                      ! (/ Type, curveIndex, State, alpha /)
BoundaryName = BC_periodicx+                    ! BC index 3
BoundaryType = (/1,0,0,-1/)                     ! (/ Type, curveIndex, State, alpha /)
BoundaryName = BC_wall_upper                    ! BC index 4
BoundaryType = (/4,0,1,0/)                      ! (/ Type, curveIndex, State, alpha /)
BoundaryName = BC_periodicx-                    ! BC index 4
BoundaryType = (/1,0,0,1/)                      ! (/ Type, curveIndex, State, alpha /)
BoundaryName = BC_periodicz+                    ! BC index 4
BoundaryType = (/1,0,0,-2/)                     ! (/ Type, curveIndex, State, alpha /)
VV  = (/2PI,0.,0./)                             ! Displacement vector 1 for bc with (/?,?,?,+-1)
VV  = (/0. ,0.,PI/)                             ! Displacement vector 2 for bc with (/?,?,?,+-2)
